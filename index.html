<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Totalizador de Venta</title>
  </head>
  <body>
    <h1>Totalizador de Venta</h1>
    <form id="totalizador-form">
      <label for="cantidad">Cantidad:</label>
      <input type="text" inputmode="numeric" id="cantidad" />
      <label for="precio">Precio por unidad:</label>
      <input type="text" inputmode="decimal" id="precio" />
      <label for="estado">Estado:</label>
      <select id="estado">
        <option value="UT">UT</option>
        <option value="NV">NV</option>
        <option value="TX">TX</option>
        <option value="AL">AL</option>
        <option value="CA" selected>CA</option>
      </select>
      <label for="categoria">Categoría:</label>
      <select id="categoria">
        <option value="Varios" selected>Varios</option>
        <option value="Alimentos">Alimentos</option>
        <option value="Electrónicos">Electrónicos</option>
      </select>
      <label for="tipo-cliente">Tipo de cliente:</label>
      <select id="tipo-cliente">
        <option value="Normal" selected>Normal</option>
        <option value="Recurrente">Recurrente</option>
        <option value="Antiguo Recurrente">Antiguo Recurrente</option>
        <option value="Especial">Especial</option>
      </select>
      <label for="peso-volumetrico">Peso volumétrico por unidad:</label>
      <input type="text" inputmode="decimal" id="peso-volumetrico" value="0" />
      <button type="submit" id="confirmar-button">Confirmar compra</button>
      <button type="reset" id="cancelar-button">Cancelar compra</button>
    </form>
    <div id="error-div" role="alert"></div>
    <div id="resultado-div" role="status"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
