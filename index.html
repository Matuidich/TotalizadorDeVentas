<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Totalizador de Venta</title>
  </head>
  <body>
    <h1>Totalizador de Venta</h1>
    <form id="totalizador-form">
      <label for="cantidad">Cantidad:</label>
      <input type="text" inputmode="numeric" id="cantidad" />
      <label for="precio">Precio por unidad:</label>
      <input type="text" inputmode="decimal" id="precio" />
      <label for="estado">Estado:</label>
      <select id="estado">
        <option value="">Seleccione un estado</option>
        <option value="UT">UT</option>
        <option value="NV">NV</option>
        <option value="TX">TX</option>
        <option value="AL">AL</option>
        <option value="CA">CA</option>
      </select>
      <button type="submit" id="confirmar-button">Confirmar compra</button>
      <button type="reset" id="cancelar-button">Cancelar compra</button>
    </form>
    <div id="error-div" role="alert"></div>
    <div id="resultado-div" role="status"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
